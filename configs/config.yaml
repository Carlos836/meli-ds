# Configuración del proyecto Meli DS

# Configuración general
project:
  name: "meli-ds"
  version: "1.0.0"
  description: "Data Science project for MercadoLibre"

# Configuración de datos
data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  external_path: "data/external"
  
# Configuración de modelos
models:
  experiments_path: "models/experiments"
  production_path: "models/production"
  random_state: 42

# Configuración de MLflow
mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "meli-experiments"

# Configuración de logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/meli-ds.log"

# Configuración de API
api:
  host: "0.0.0.0"
  port: 8000
  debug: true
